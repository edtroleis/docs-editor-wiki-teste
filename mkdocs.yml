site_name: Wiki de teste
repo_url: https://github.com/edtroleis/docs-editor-wiki-teste
edit_uri: edit/main/docs/

# Sem "nav": o menu é montado a partir das pastas de docs/.
# Criar uma página é só criar um arquivo .md.

plugins:
  - techdocs-core
  # "Criado em" e "Última atualização" no rodapé de cada página, a partir do histórico do Git
  - git-revision-date-localized:
      type: custom
      custom_format: "%d/%m/%Y %H:%M:%S"   # 22/10/2026 12:35:27
      timezone: America/Sao_Paulo   # sem isto as datas saem em UTC
      locale: pt
      enable_creation_date: true
      fallback_to_build_date: true

# Interface do tema em português (ex.: "Criado em", "Última atualização")
theme:
  name: material
  language: pt-BR
